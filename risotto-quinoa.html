<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quinoa façon risotto aux champignons</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a href="index.html" class="site-title">RECETTARIUM</a>

        <button type="button" class="hamburger" id="menu-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Ouvrir le menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="site-nav" id="site-nav">

            <div class="nav-dropdown" data-nav-dropdown>
                <button type="button" class="nav-dropdown-toggle" aria-expanded="false">
                    <span>Desserts</span>
                    <svg class="nav-arrow" viewBox="0 0 12 8" aria-hidden="true">
                        <path d="M1 1l5 5 5-5"/>
                    </svg>
                </button>
                <div class="nav-dropdown-panel">
                    <div class="nav-dropdown-panel-inner" data-nav-category="desserts"></div>
                </div>
            </div>

            <div class="nav-dropdown" data-nav-dropdown>
                <button type="button" class="nav-dropdown-toggle" aria-expanded="false">
                    <span>Plats salés</span>
                    <svg class="nav-arrow" viewBox="0 0 12 8" aria-hidden="true">
                        <path d="M1 1l5 5 5-5"/>
                    </svg>
                </button>
                <div class="nav-dropdown-panel">
                    <div class="nav-dropdown-panel-inner" data-nav-category="sales"></div>
                </div>
            </div>

            <a href="#ingredients" class="nav-link">Ingrédients</a>
            <a href="#preparation" class="nav-link">Préparation</a>

        </nav>

    </div>
</header>


<main>

    <!-- HERO -->
    <section class="hero">

        <div class="hero-image">
            <img
                id="recipe-image"
                src="images/risotto-quinoa.jpg"
                alt="Quinoa façon risotto aux champignons"
            >
        </div>

        <div class="hero-content">

            <h1 id="recipe-title">Quinoa façon risotto aux champignons</h1>

            <p id="recipe-description" class="description"></p>

            <div class="recipe-meta">

                <div class="meta-item">
                    <span class="meta-label">PORTIONS</span>
                    <span id="recipe-servings"></span>
                </div>

                <div class="meta-item">
                    <span class="meta-label">MOULE</span>
                    <span id="recipe-pan-size"></span>
                </div>

                <div class="meta-item">
                    <span class="meta-label">PRÉPARATION</span>
                    <span id="recipe-preparation-time"></span>
                </div>

                <div class="meta-item">
                    <span class="meta-label">REPOS</span>
                    <span id="recipe-resting-time"></span>
                </div>

            </div>

            <p class="photo-credit">
                Photo : Number55,
                <a href="https://commons.wikimedia.org/wiki/File:Risotto_ai_funghi_porcini.JPG">Wikimedia Commons</a>
            </p>

        </div>

    </section>


    <!-- SOMMAIRE -->
    <section id="sommaire" class="section toc-section">

        <div class="section-heading">
            <span class="section-number">00</span>
            <h2>Sommaire</h2>
        </div>

        <nav id="toc-container" class="toc-container"></nav>

    </section>


    <!-- INGREDIENTS -->
    <section id="ingredients" class="section ingredients-section">

        <div class="section-heading">
            <span class="section-number">01</span>
            <h2>Ingrédients</h2>
        </div>

        <div id="ingredients-container" class="ingredients-container"></div>

    </section>


    <!-- PREPARATION -->
    <section id="preparation" class="section preparation-section">

        <div class="section-heading">
            <span class="section-number">02</span>
            <h2>Préparation</h2>
        </div>

        <div id="steps-container" class="steps-container"></div>

    </section>

</main>


<footer>
    <p>RECETTARIUM</p>
</footer>


<script src="nav.js"></script>
<script src="script.js"></script>

</body>
